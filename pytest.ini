[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts =
    --headed
    --reruns 2
    --reruns-delay 1
markers =
    smoke: Fastest sanity check; environment and login
    acceptance: Business-critical path (upload → delete → restore)
    functional: Validation-rule coverage (Phase 2)
    integration: Cross-component / cross-view flows (Phase 2)
    framework: FR-15 framework self-verification (not a product suite)
filterwarnings =
    ignore::DeprecationWarning
